<div class="category-form">
  <h1>{{ isEditMode() ? 'Modifier la catégorie' : 'Nouvelle catégorie' }}</h1>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nom</mat-label>
      <input matInput formControlName="name" />
      <mat-error *ngIf="getError('name')">{{ getError('name') }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput rows="4" formControlName="description"></textarea>
      <mat-error *ngIf="getError('description')">{{ getError('description') }}</mat-error>
    </mat-form-field>

    <div class="actions">
      <button mat-flat-button color="primary" type="submit" [disabled]="loading() || loadingData()">
        <mat-icon>{{ loading() ? 'hourglass_top' : 'save' }}</mat-icon>
        {{ isEditMode() ? 'Enregistrer' : 'Créer' }}
      </button>
      <button mat-button type="button" (click)="router.navigate(['/categories'])" [disabled]="loading() || loadingData()">
        Annuler
      </button>
    </div>

    <div class="loader" *ngIf="loadingData()">
      <mat-progress-spinner mode="indeterminate" diameter="40"></mat-progress-spinner>
    </div>
  </form>
</div>
